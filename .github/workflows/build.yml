---
name: Build and test

on:
  workflow_dispatch:

  push:
    branches:
      - jazzy
      - jazzy_dev

  pull_request:
    branches:
      - jazzy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --verbosity=2
