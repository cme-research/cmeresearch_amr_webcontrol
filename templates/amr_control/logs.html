{% extends 'amr_control/_base.html' %}
{% block title %}Logs · AMR Control{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fas fa-terminal me-2"></i>Robot Container Logs</span>
        <div>
            <button id="logs-toggle" class="btn btn-sm btn-outline-secondary">
                <i class="fas fa-play"></i> Start
            </button>
            <button id="logs-clear" class="btn btn-sm btn-outline-secondary ms-1">
                <i class="fas fa-trash"></i> Clear
            </button>
        </div>
    </div>
    <div class="card-body p-0">
        <pre id="docker-logs" style="height: calc(100vh - 200px); min-height: 300px; overflow-y: auto; margin: 0; padding: 10px; background-color: #1e1e1e; color: #d4d4d4; font-size: 0.85rem; white-space: pre-wrap; word-wrap: break-word;"></pre>
    </div>
</div>
{% endblock %}
