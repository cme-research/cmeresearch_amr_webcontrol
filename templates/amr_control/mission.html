{% extends 'amr_control/_base.html' %}
{% block title %}Mission · AMR Control{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header"><i class="fas fa-gamepad me-2"></i>Robot Control</div>
    <div class="card-body">
        <form method="post" action="{% url 'handle_button' %}" id="mission-form">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-4">
                    <button type="submit" name="button_type" value="button1" class="btn btn-primary action-btn">
                        <i class="fas fa-play me-2"></i>Start Mission
                    </button>
                </div>
                <div class="col-md-4">
                    <button type="submit" name="button_type" value="button2" class="btn btn-danger action-btn">
                        <i class="fas fa-stop me-2"></i>Emergency Stop
                    </button>
                </div>
                <div class="col-md-4">
                    <button type="submit" name="button_type" value="button3" id="reset-btn" class="btn btn-warning action-btn" disabled>
                        <i class="fas fa-undo me-2"></i>Reset / Clear E-Stop
                    </button>
                </div>
            </div>
        </form>

        <!-- Motor status grid (shown when state machine has driver info) -->
        <div id="motor-status-panel" class="mt-3" style="display:none;">
            <hr class="my-2">
            <div class="d-flex align-items-center mb-2">
                <small class="text-muted me-2">Motor status:</small>
                <div id="motor-status-grid" class="d-flex gap-2 flex-wrap"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
